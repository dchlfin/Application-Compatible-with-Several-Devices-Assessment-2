<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- external google font stylesheets -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200..900&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vollkorn:ital,wght@0,400..900;1,400..900&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap">

    <!-- external css website stylesheets -->
    <link rel="stylesheet" href="heiWealth.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
</head>
<body>
    <header>
        <div>
            <h1><span class="hei">hei</span>Wealth<span id="brand-kanji">食育</span></h1>
        </div>
        <div id="toggle-nav-btn">
            <img src="assets/nav_toggle_icon.png">
        </div>
        </div>
        <nav class="nav" id="nav">
            <ul>
                <li class="home">
                    <a href="home.html">Home</a>
                </li>
                <li class="principles">
                    <a class="principles" href="principles.html">Principles</a>
                </li>
                <li class="diet">
                    <a class="diet" href="diet.html">Diet</a>
                </li>
                <li class="game">
                    <a class="game" href="game.html">Build Your Plate</a>
                </li>
                <li class="faq">
                    <a class="faq" href="faq.html">FAQ</a>
                </li>
            </ul>
        </nav>
    </header>

    <div class="g-header">
        <h1><i>Build Your Plate</i></h1>
        <p>Choose your soup, main, sides, and rice to create your own Ichiju Sansai set!</p>
    </div>

    <div class="plate">
        <div class="dish" id="soup">Soup</div>
        <div class="dish" id="rice">Rice</div>
        <div class="dish" id="main-dish">Main Dish</div>
        <div class="dish" id="side-dish">Side Dish</div>
        <div class="dish" id="pickles">Pickles</div>
    </div>

    <div class="set-builder">
        <div class="dropdown">
            <p>Rice</p>
            <div class="dropdown-opts">
                <button id="rice1">White Rice</button>
                <button id="rice2">Brown Rice</button>
                <button id="rice3">Mixed Grain Rice</button>
            </div>
        </div>
        <div class="dropdown">
            <p>Main Dish</p>
            <div class="dropdown-opts">
                <button id="main1">Grilled Salmon</button>
                <button id="main2">Tamagoyaki</button>
                <button id="main3">Teriyaki Chicken</button>
            </div>
        </div>
        <div class="dropdown">
            <p>Side Dish</p>
            <div class="dropdown-opts">
                <button id="side1">Spinach with Sesame</button>
                <button id="side2">Pickled Cucumbers</button>
                <button id="side3">Braised Burdock Root</button>
            </div>
        </div>
        <div class="dropdown">
            <p>Pickles</p>
            <div class="dropdown-opts">
                <button id="pickles1">Umeboshi (Pickled Plum)</button>
                <button id="pickles2">Takuan (Yellow Radish)</button>
                <button id="pickles3">Pickled Daikon</button>
            </div>
        </div>
        <div class="dropdown">
            <p>Soup</p>
            <div class="dropdown-opts">
                <button id="soup1">Miso Soup with Tofu and Wakame</button>
                <button id="soup2">Clear Dashi Soup</button>
                <button id="soup3">Mushroom Miso Soup</button>
            </div>
        </div>
    </div>
    <script src="heiWealth.js"></script>
</body>
</html>
